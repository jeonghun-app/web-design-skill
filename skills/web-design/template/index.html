<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO and share head (web-quality.md SE-*). Crawlers and share bots read this HTML without running JS,
         so it must be complete here. %VITE_SITE_URL% comes from .env; set it to the real origin. -->
    <title>Lumen · The calm work queue for busy teams</title>
    <meta name="description" content="Lumen sorts requests from chat, email and forms into one queue, so your team always knows the next right task." />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <!-- theme-color = color.bg (light/dark) from tokens.resolved.json, as hex for browser support. -->
    <meta name="theme-color" content="#fbfcfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d11" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.png" sizes="48x48" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lumen" />
    <meta property="og:title" content="Lumen · The calm work queue for busy teams" />
    <meta property="og:description" content="One queue for every request, sorted so the next right task is always on top." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lumen: Ship the work, not the busywork." />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          { "@type": "Organization", "@id": "%VITE_SITE_URL%/#org", "name": "Lumen Labs", "url": "%VITE_SITE_URL%/", "logo": "%VITE_SITE_URL%/icon-512.png" },
          { "@type": "WebSite", "@id": "%VITE_SITE_URL%/#website", "name": "Lumen", "url": "%VITE_SITE_URL%/", "publisher": { "@id": "%VITE_SITE_URL%/#org" } }
        ]
      }
    </script>
    <script>
      // Set theme and trend before first paint so there is no flash of the wrong style.
      (function () {
        var d = document.documentElement;
        var theme = localStorage.getItem('wd-theme');
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        d.dataset.theme = theme;
        // ?trend= or the dev switcher override the default set by `trend apply`; "none" removes it.
        var trend = new URLSearchParams(location.search).get('trend') || localStorage.getItem('wd-trend');
        if (trend === 'none') delete d.dataset.trend;
        else if (trend) d.dataset.trend = trend;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
